<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Capture ideas before they disappear </p>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
            </nav>
    </header>
<main>
    <section>
        <h2>Add a new note</h2>
        <form id="note-form">
            <label for="note-input">New Note:</label>
            <input type="text" id="note-input" placeholder="Type a Note ...">
            <button type="submit">Add Note</button>
        </form>
    </section>

    <section>
        <h2>Your Notes</h2>
        <p id="note-count">You have 2 notes.</p>
        <ul id="notes-list">
            <li>Revise HTML forms</li>
            <li>Push my code to GitHub</li>
        </ul>
    </section>

</main>
    <footer>
        <p>QuickNotes &copy; 2026</p>
    </footer>
</body>
</html>
