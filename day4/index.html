<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="notes-app">
        <h1>Quick Notes</h1>
        <label for="note-text">Your note</label>
        <textarea id="note-text" rows="8" placeholder="Write your note here..."></textarea>
        <div class="counts" aria-live="polite">
            <p id="char-count">0 / 200 characters</p>
            <p id="word-count">0 words</p>
        </div>
        <div class="actions">
            <button id="clear-btn" type="button">Clear</button>
            <button id="theme-toggle" type="button">Dark mode</button>
        </div>
    </main>
</body>
</html>
